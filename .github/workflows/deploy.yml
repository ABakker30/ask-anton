name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Backend -> Windows server via SSH (same box as the Gestura engine).
  deploy-server:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          port:     ${{ secrets.SERVER_SSH_PORT || 22 }}
          script_stop: true
          # Single PowerShell invocation so all output streams back through SSH.
          # ASK_DIR is the repo clone path on the box (default C:\ask-anton).
          script: |
            powershell -ExecutionPolicy Bypass -Command "$d = if ($env:ASK_DIR) { $env:ASK_DIR } else { 'C:\ask-anton' }; Set-Location $d; Write-Host '[ssh] git fetch'; git fetch --quiet origin; Write-Host '[ssh] git reset'; git reset --hard origin/main; Write-Host '[ssh] invoking deploy.ps1'; & (Join-Path $d 'deploy.ps1'); Write-Host ('[ssh] deploy.ps1 exit code: ' + $LASTEXITCODE)"

      # Public-URL verification. Best-effort: before the ask.gestura.art tunnel
      # ingress is configured this will not resolve, so it must not fail the deploy
      # (deploy.ps1's local 127.0.0.1:8001 probe is the hard gate). Set the
      # ASK_PUBLIC_URL repo variable once the tunnel is live to make this meaningful.
      - name: Verify public URL (best-effort)
        continue-on-error: true
        env:
          ASK_PUBLIC_URL: ${{ vars.ASK_PUBLIC_URL }}
        run: |
          url="${ASK_PUBLIC_URL:-https://ask.gestura.art}"
          echo "Checking $url/build-info for SHA $GITHUB_SHA"
          for attempt in $(seq 1 12); do
            body=$(curl -fsS --max-time 8 "$url/build-info" || true)
            sha=$(echo "$body" | python3 -c "import json,sys; print(json.loads(sys.stdin.read() or '{}').get('commit_sha',''))" 2>/dev/null || echo "")
            echo "  attempt $attempt: commit_sha=$sha"
            [ "$sha" = "$GITHUB_SHA" ] && { echo "Verified."; exit 0; }
            sleep 5
          done
          echo "::warning::Public URL did not confirm the new SHA (expected until the tunnel ingress is configured)."
