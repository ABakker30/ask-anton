<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ask Anton</title>
<style>
  :root {
    --bg: #0e0f12;
    --panel: #16181d;
    --line: #262a31;
    --ink: #e8e9ec;
    --muted: #9aa0aa;
    --accent: #c8a96a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 "Georgia", "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding: 28px 20px 18px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 26px; letter-spacing: 0.5px; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 14px; font-style: italic; }
  #chat {
    flex: 1;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 20px 120px;
  }
  .msg { margin: 0 0 22px; }
  .msg .who {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .msg.user .bubble { color: var(--accent); }
  .bubble { white-space: pre-wrap; }
  .bubble.thinking { color: var(--muted); font-style: italic; }
  .media { margin-top: 14px; display: flex; flex-direction: column; gap: 16px; }
  .media figure { margin: 0; }
  .media img, .media video {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
  }
  .media figcaption {
    margin-top: 6px;
    font-size: 13px;
    font-style: italic;
    color: var(--muted);
  }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 28px; }
  .suggestions button {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 8px 12px;
    border-radius: 999px;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
  }
  .suggestions button:hover { color: var(--ink); border-color: var(--accent); }
  .feedback { color: var(--muted); font-size: 13px; margin: 2px 0 18px; display: flex; align-items: center; gap: 8px; }
  .feedback button { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 2px 9px; cursor: pointer; font-size: 14px; }
  .feedback button:hover { border-color: var(--accent); }
  .feedback .rate { display: flex; align-items: center; gap: 8px; }
  .feedback .share { margin-left: auto; }
  .media figure img { cursor: zoom-in; }
  .see-more { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; margin: 4px 0 8px; }
  .see-more:hover { border-color: var(--accent); color: var(--ink); }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 24px; cursor: zoom-out; }
  #lightbox.open { display: flex; }
  #lightbox img, #lightbox video { max-width: 94vw; max-height: 84vh; border-radius: 6px; }
  #lightbox figcaption { color: #ddd; font-size: 13px; margin-top: 12px; max-width: 700px; text-align: center; }
  form {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, var(--bg) 28%);
    padding: 24px 20px;
    /* The gradient strip is visually transparent at the top; without this it would
       still intercept clicks on content showing through it (e.g. a "See more" button). */
    pointer-events: none;
  }
  .inrow {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 6px 6px 6px 16px;
    pointer-events: auto;
  }
  input {
    flex: 1;
    background: transparent;
    border: 0;
    color: var(--ink);
    font: inherit;
    outline: none;
  }
  button.send {
    background: var(--accent);
    color: #1a1408;
    border: 0;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    font: inherit;
  }
  button.send:disabled { opacity: 0.5; cursor: default; }
  #turnstile-holder { max-width: 760px; margin: 10px auto 0; display: flex; justify-content: center; pointer-events: auto; }
</style>
</head>
<body>
  <header>
    <h1>Ask Anton</h1>
    <p>Questions about Anton Bakker and his lattice-path sculpture</p>
  </header>

  <div id="chat">
    <div class="suggestions" id="suggestions">
      <button>What is your work about?</button>
      <button>Show me Awakening</button>
      <button>Why are your paths always closed?</button>
      <button>Where has your work been shown?</button>
      <button>What does "music for the eyes" mean?</button>
      <button>Who was Koos Verhoeff?</button>
    </div>
  </div>

  <form id="form">
    <div class="inrow">
      <input id="q" placeholder="Ask a question..." autocomplete="off" />
      <button class="send" id="send" type="submit">Ask</button>
    </div>
    <div id="turnstile-holder"></div>
  </form>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("q");
  const sendBtn = document.getElementById("send");
  const suggestions = document.getElementById("suggestions");
  const history = [];

  // Anonymous per-visit session id (no PII) for usage telemetry.
  let sessionId = sessionStorage.getItem("aa_sid");
  if (!sessionId) {
    sessionId = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : Date.now() + "-" + Math.random().toString(36).slice(2);
    sessionStorage.setItem("aa_sid", sessionId);
  }

  // Served from the box (same origin) in production; falls back to the local
  // uvicorn when the file is opened from a preview pane or file://.
  const API_BASE =
    location.origin && location.origin.startsWith("http")
      ? location.origin
      : "http://localhost:8000";

  // ── Optional Cloudflare Turnstile ──────────────────────────────────────────
  let turnstileEnabled = false;
  let turnstileToken = null;
  let turnstileWidgetId = null;

  async function initConfig() {
    try {
      const cfg = await (await fetch(API_BASE + "/config")).json();
      if (cfg.turnstile && cfg.turnstile_sitekey) {
        turnstileEnabled = true;
        window.__onTurnstile = (t) => { turnstileToken = t; maybeAutoAsk(); };
        window.__renderTurnstile = () => {
          turnstileWidgetId = window.turnstile.render("#turnstile-holder", {
            sitekey: cfg.turnstile_sitekey,
            callback: window.__onTurnstile,
            theme: "dark",
          });
        };
        const s = document.createElement("script");
        s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?onload=__renderTurnstile";
        s.async = true; s.defer = true;
        document.head.appendChild(s);
      }
    } catch (e) { /* config is best-effort; default to no turnstile */ }
  }

  function addMsg(who, label, text, cls) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + who;
    const w = document.createElement("div");
    w.className = "who";
    w.textContent = label;
    const b = document.createElement("div");
    b.className = "bubble" + (cls ? " " + cls : "");
    b.textContent = text;
    wrap.append(w, b);
    chat.append(wrap);
    window.scrollTo(0, document.body.scrollHeight);
    return b;
  }

  // Full catalog (loaded once) powers the "see more of this piece" galleries.
  const pieceItems = {};   // piece_slug -> [items]
  const urlPiece = {};     // url -> piece_slug
  async function loadCatalog() {
    try {
      const items = await (await fetch(API_BASE + "/media-catalog")).json();
      items.forEach((m) => {
        if (!m || !m.url) return;
        (pieceItems[m.piece_slug] = pieceItems[m.piece_slug] || []).push(m);
        urlPiece[m.url] = m.piece_slug;
      });
    } catch (e) { /* see-more is best-effort */ }
  }

  let lightboxEl = null;
  function openLightbox(m) {
    if (!lightboxEl) {
      lightboxEl = document.createElement("div");
      lightboxEl.id = "lightbox";
      lightboxEl.addEventListener("click", closeLightbox);
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLightbox(); });
      document.body.appendChild(lightboxEl);
    }
    lightboxEl.innerHTML = "";
    const fig = document.createElement("figure");
    fig.style.cssText = "margin:0;display:flex;flex-direction:column;align-items:center";
    let el;
    if (m.kind === "video") {
      el = document.createElement("video");
      el.src = m.url; el.controls = true; el.autoplay = true; el.playsInline = true;
      el.addEventListener("click", (e) => e.stopPropagation()); // keep controls usable
    } else {
      el = document.createElement("img");
      el.src = m.url; el.alt = m.alt || "";
    }
    fig.appendChild(el);
    if (m.caption) { const c = document.createElement("figcaption"); c.textContent = m.caption; fig.appendChild(c); }
    lightboxEl.appendChild(fig);
    lightboxEl.classList.add("open");
  }
  function closeLightbox() { if (lightboxEl) { lightboxEl.classList.remove("open"); lightboxEl.innerHTML = ""; } }

  function mediaFigure(m) {
    const fig = document.createElement("figure");
    if (m.kind === "video") {
      const vid = document.createElement("video");
      vid.src = m.url; vid.controls = true; vid.preload = "metadata"; vid.playsInline = true;
      if (m.alt) vid.setAttribute("aria-label", m.alt);
      fig.appendChild(vid);
    } else {
      const img = document.createElement("img");
      img.src = m.url; img.alt = m.alt || ""; img.loading = "lazy";
      img.addEventListener("click", () => openLightbox(m));
      fig.appendChild(img);
    }
    if (m.caption) { const cap = document.createElement("figcaption"); cap.textContent = m.caption; fig.appendChild(cap); }
    return fig;
  }

  function appendMedia(bubble, media) {
    if (!Array.isArray(media) || !media.length) return;
    const box = document.createElement("div");
    box.className = "media";
    const shown = new Set();
    media.forEach((m) => { if (m && m.url) { box.appendChild(mediaFigure(m)); shown.add(m.url); } });
    bubble.appendChild(box);

    // Offer the rest of the piece(s) shown, if the catalog has more than we displayed.
    const slugs = new Set();
    media.forEach((m) => { const s = m && urlPiece[m.url]; if (s) slugs.add(s); });
    let more = [];
    slugs.forEach((s) => (pieceItems[s] || []).forEach((m) => { if (!shown.has(m.url)) more.push(m); }));
    const seen = new Set();
    more = more.filter((m) => !seen.has(m.url) && seen.add(m.url));
    if (more.length) {
      let label = "See more images";
      if (slugs.size === 1) {
        const s = [...slugs][0];
        const nm = pieceItems[s] && pieceItems[s][0] && pieceItems[s][0].piece;
        if (nm) label = "See more of " + nm;
      }
      const btn = document.createElement("button");
      btn.className = "see-more";
      btn.textContent = label + " (" + more.length + ")";
      btn.addEventListener("click", () => {
        const grid = document.createElement("div");
        grid.className = "media";
        more.forEach((m) => grid.appendChild(mediaFigure(m)));
        bubble.appendChild(grid);
        btn.remove();
        window.scrollTo(0, document.body.scrollHeight);
      });
      bubble.appendChild(btn);
    }
    window.scrollTo(0, document.body.scrollHeight);
  }

  function renderFollowups(followups) {
    if (!Array.isArray(followups) || !followups.length) return;
    const box = document.createElement("div");
    box.className = "suggestions";
    box.id = "followups";
    followups.forEach((q) => {
      if (!q) return;
      const b = document.createElement("button");
      b.textContent = q;
      b.addEventListener("click", () => ask(q, "pill"));
      box.appendChild(b);
    });
    chat.append(box);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function renderFeedback(question) {
    const wrap = document.createElement("div");
    wrap.className = "feedback";

    const rate = document.createElement("span");
    rate.className = "rate";
    const label = document.createElement("span");
    label.textContent = "Was this helpful?";
    rate.appendChild(label);
    let done = false;
    [["👍", 1], ["👎", -1]].forEach(([glyph, rating]) => {
      const b = document.createElement("button");
      b.textContent = glyph;
      b.setAttribute("aria-label", rating === 1 ? "Helpful" : "Not helpful");
      b.addEventListener("click", () => {
        if (done) return;
        done = true;
        rate.textContent = "Thank you for the feedback.";
        try {
          fetch(API_BASE + "/feedback", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: sessionId, question, rating }),
          });
        } catch (e) {}
      });
      rate.appendChild(b);
    });
    wrap.appendChild(rate);

    // Share: copies (or shares) a link that re-opens this question for anyone.
    const share = document.createElement("button");
    share.className = "share";
    share.textContent = "Share";
    share.addEventListener("click", async () => {
      const url = location.origin + "/?q=" + encodeURIComponent(question);
      const copied = () => { share.textContent = "Link copied"; setTimeout(() => (share.textContent = "Share"), 1800); };
      try {
        if (navigator.share) { await navigator.share({ title: "Ask Anton", text: question, url }); }
        else { await navigator.clipboard.writeText(url); copied(); }
      } catch (e) {
        try { await navigator.clipboard.writeText(url); copied(); } catch (_) {}
      }
    });
    wrap.appendChild(share);

    chat.append(wrap);
  }

  function bodyFor(question, source) {
    return JSON.stringify({ question, history, turnstile_token: turnstileToken, session_id: sessionId, source: source || "type" });
  }

  function parseSSE(raw) {
    let event = "message", data = "";
    raw.split("\n").forEach((line) => {
      if (line.startsWith("event:")) event = line.slice(6).trim();
      else if (line.startsWith("data:")) data += line.slice(5).trim();
    });
    try { return { event, data: data ? JSON.parse(data) : {} }; } catch (_) { return null; }
  }

  // Streaming path: returns true if it handled the turn, false to fall back to /ask.
  async function streamAsk(question, source, bubble) {
    let res;
    try {
      res = await fetch(API_BASE + "/ask-stream", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: bodyFor(question, source),
      });
    } catch (e) { return false; }
    const ct = res.headers.get("content-type") || "";
    if (!res.ok || !ct.includes("text/event-stream") || !res.body) {
      let detail = null;
      try { detail = (await res.json()).detail; } catch (_) {}
      if (detail) { bubble.classList.remove("thinking"); bubble.textContent = detail; return true; }
      return false; // transient -> fall back
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "", answer = "", started = false, media = [], followups = [];
    while (true) {
      let chunk;
      try { chunk = await reader.read(); } catch (e) { break; }
      if (chunk.done) break;
      buf += dec.decode(chunk.value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const ev = parseSSE(buf.slice(0, i));
        buf = buf.slice(i + 2);
        if (!ev) continue;
        if (ev.event === "delta") {
          if (!started) { bubble.classList.remove("thinking"); bubble.textContent = ""; started = true; }
          answer += ev.data.text || "";
          bubble.textContent = answer;
          window.scrollTo(0, document.body.scrollHeight);
        } else if (ev.event === "done") {
          media = ev.data.media || []; followups = ev.data.followups || [];
        } else if (ev.event === "error" && !started) {
          return false; // nothing shown yet -> fall back
        }
      }
    }
    if (!started) return false;
    appendMedia(bubble, media);
    history.push({ role: "user", content: question });
    history.push({ role: "assistant", content: answer });
    renderFeedback(question);
    renderFollowups(followups);
    return true;
  }

  // Non-streaming fallback (with a single retry for transient gateway/restart errors).
  async function nonStreamAsk(question, source, bubble) {
    let data = null;
    for (let attempt = 0; attempt < 2 && !data; attempt++) {
      if (attempt) await new Promise((r) => setTimeout(r, 1500));
      let res, text;
      try {
        res = await fetch(API_BASE + "/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: bodyFor(question, source) });
        text = await res.text();
      } catch (netErr) { continue; }
      let parsed = null;
      try { parsed = JSON.parse(text); } catch (_) {}
      if (res.ok && parsed && typeof parsed.answer === "string") data = parsed;
      else if (parsed && parsed.detail) throw new Error(parsed.detail);
    }
    if (!data) throw new Error("Anton is momentarily unavailable - the server may be restarting. Please try again in a moment.");
    bubble.classList.remove("thinking");
    bubble.textContent = data.answer;
    appendMedia(bubble, data.media);
    history.push({ role: "user", content: question });
    history.push({ role: "assistant", content: data.answer });
    renderFeedback(question);
    renderFollowups(data.followups);
  }

  async function ask(question, source) {
    if (turnstileEnabled && !turnstileToken) {
      addMsg("anton", "Anton", "One moment — please complete the verification below, then ask again.", "thinking");
      return;
    }
    if (suggestions) suggestions.remove();
    const staleF = document.getElementById("followups");
    if (staleF) staleF.remove();
    addMsg("user", "You", question);
    input.value = "";
    sendBtn.disabled = true;
    const bubble = addMsg("anton", "Anton", "thinking...", "thinking");
    try {
      const handled = await streamAsk(question, source, bubble);
      if (!handled) await nonStreamAsk(question, source, bubble);
    } catch (err) {
      bubble.classList.remove("thinking");
      bubble.textContent = err.message;
    } finally {
      // Turnstile tokens are single-use; fetch a fresh one for the next question.
      if (turnstileEnabled && turnstileWidgetId !== null && window.turnstile) {
        turnstileToken = null;
        try { window.turnstile.reset(turnstileWidgetId); } catch (e) {}
      }
      sendBtn.disabled = false;
      // Only refocus on desktop (fine pointer). On touch, leave focus off so the
      // mobile keyboard doesn't pop up and eat the screen after each answer.
      if (window.matchMedia && window.matchMedia("(pointer: fine)").matches) input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (q) ask(q, "type");
  });

  document.querySelectorAll(".suggestions button").forEach((b) => {
    b.addEventListener("click", () => ask(b.textContent, "pill"));
  });

  // Shareable links: opening ?q=... (or ?ask=...) re-asks that question for the visitor.
  let pendingQ = (() => {
    const p = new URLSearchParams(location.search);
    return (p.get("q") || p.get("ask") || "").trim().slice(0, 400);
  })();
  function maybeAutoAsk() {
    if (!pendingQ) return;
    if (turnstileEnabled && !turnstileToken) return; // wait until verification completes
    const q = pendingQ; pendingQ = "";
    try { window.history.replaceState(null, "", location.pathname); } catch (e) {}
    ask(q, "link");
  }

  initConfig().then(maybeAutoAsk);
  loadCatalog();
</script>
</body>
</html>
